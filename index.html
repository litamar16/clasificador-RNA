<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba</title>
</head>

<body>

    <h1>Prueba de JavaScript</h1>

    <input id="numero" type="number" placeholder="Número">

    <button onclick="analizar()">
        ANALIZAR
    </button>

    <button onclick="limpiar()">
        LIMPIAR
    </button>

    <h2 id="resultado"></h2>


    <script>

        function analizar() {

            let numero =
                document.getElementById("numero").value;

            document.getElementById("resultado").innerHTML =
                "✅ FUNCIONA. Escribiste: " + numero;

        }


        function limpiar() {

            document.getElementById("numero").value = "";

            document.getElementById("resultado").innerHTML = "";

        }

    </script>

</body>
</html>
