<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>🧠 Clasificador RNA</title>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #101827,
                    #182b49,
                    #263b63
                );

            color: white;

            padding: 20px;

        }


        .app {

            width: 100%;

            max-width: 650px;

            margin: 30px auto;

        }


        /* ENCABEZADO */

        .encabezado {

            text-align: center;

            margin-bottom: 25px;

        }


        .cerebro {

            font-size: 65px;

            margin-bottom: 5px;

        }


        h1 {

            margin: 5px 0;

            font-size: 32px;

        }


        .subtitulo {

            color: #cbd5e1;

            margin-top: 8px;

        }


        /* TARJETA PRINCIPAL */

        .tarjeta {

            background: rgba(255,255,255,0.10);

            border: 1px solid rgba(255,255,255,0.15);

            border-radius: 22px;

            padding: 25px;

            backdrop-filter: blur(10px);

            box-shadow:
                0 15px 40px rgba(0,0,0,0.3);

        }


        /* ESTADO */

        .estado {

            text-align: center;

            padding: 12px;

            border-radius: 12px;

            background: rgba(0,0,0,0.20);

            margin-bottom: 25px;

            font-weight: bold;

        }


        /* INPUT */

        label {

            display: block;

            margin-bottom: 8px;

            color: #dbeafe;

        }


        input {

            width: 100%;

            padding: 16px;

            border-radius: 12px;

            border: 2px solid transparent;

            outline: none;

            font-size: 22px;

            text-align: center;

            background: white;

            color: #172033;

        }


        input:focus {

            border-color: #60a5fa;

        }


        /* BOTONES */

        .botones {

            display: flex;

            gap: 10px;

            margin-top: 15px;

        }


        button {

            flex: 1;

            padding: 15px;

            border: none;

            border-radius: 12px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

        }


        .analizar {

            background: #22c55e;

            color: white;

        }


        .limpiar {

            background: #64748b;

            color: white;

        }


        button:hover {

            transform: translateY(-2px);

            opacity: 0.9;

        }


        /* RESULTADO */

        #resultado {

            margin-top: 25px;

        }


        .numero {

            text-align: center;

            font-size: 55px;

            font-weight: bold;

            margin: 10px 0 20px;

        }


        .grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 15px;

        }


        .resultado-card {

            background:
                rgba(255,255,255,0.10);

            border-radius: 18px;

            padding: 20px;

            text-align: center;

            border:
                1px solid
                rgba(255,255,255,0.12);

        }


        .resultado-card h3 {

            margin-top: 0;

            color: #bfdbfe;

        }


        .valor {

            font-size: 25px;

            font-weight: bold;

            margin: 15px 0;

        }


        .confianza {

            color: #cbd5e1;

            font-size: 14px;

        }


        .separador {

            border: none;

            border-top:
                1px solid
                rgba(255,255,255,0.15);

            margin: 25px 0;

        }


        /* INFORMACIÓN */

        .info {

            margin-top: 20px;

            padding: 18px;

            border-radius: 15px;

            background:
                rgba(37,99,235,0.15);

            color: #dbeafe;

            font-size: 14px;

            line-height: 1.6;

        }


        .footer {

            text-align: center;

            color: #94a3b8;

            font-size: 13px;

            margin-top: 20px;

        }


        /* CELULAR */

        @media (max-width: 600px) {

            .grid {

                grid-template-columns: 1fr;

            }


            h1 {

                font-size: 26px;

            }


            .botones {

                flex-direction: column;

            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- ENCABEZADO -->

    <div class="encabezado">

        <div class="cerebro">
            🧠
        </div>

        <h1>
            Clasificador RNA
        </h1>

        <p class="subtitulo">
            Red Neuronal Artificial para analizar números
        </p>

    </div>


    <!-- APLICACIÓN -->

    <div class="tarjeta">


        <!-- ESTADO -->

        <div
            id="estado"
            class="estado"
        >

            ⏳ Entrenando Red Neuronal...

        </div>


        <!-- ENTRADA -->

        <label for="numero">

            🔢 Introduce un número

        </label>


        <input
            id="numero"
            type="number"
            placeholder="Ejemplo: 17"
        >


        <!-- BOTONES -->

        <div class="botones">

            <button
                id="analizar"
                class="analizar"
            >

                🔍 ANALIZAR

            </button>


            <button
                id="limpiar"
                class="limpiar"
            >

                🧹 LIMPIAR

            </button>

        </div>


        <!-- RESULTADO -->

        <div id="resultado">

            <div class="info">

                🧠 Introduce un número y pulsa
                <strong>ANALIZAR</strong>.

                <br><br>

                La aplicación utilizará una
                <strong>Red Neuronal Artificial</strong>
                para realizar la clasificación.

            </div>

        </div>


    </div>


    <div class="footer">

        Proyecto académico • Redes Neuronales Artificiales

    </div>


</div>



<script>

// =================================================
// VARIABLE DE LA RNA
// =================================================

let modelo = null;


// =================================================
// COMPROBAR PRIMO
// =================================================

function esPrimo(numero) {

    if (numero < 2) {

        return false;

    }


    for (

        let i = 2;

        i <= Math.sqrt(numero);

        i++

    ) {

        if (numero % i === 0) {

            return false;

        }

    }


    return true;

}


// =================================================
// ENTRENAR RNA
// =================================================

async function entrenarRNA() {


    const estado =
        document.getElementById("estado");


    estado.innerText =
        "🧠 Entrenando Red Neuronal...";


    // Datos

    const entradas = [];

    const salidas = [];


    for (

        let numero = 1;

        numero <= 20;

        numero++

    ) {

        entradas.push([

            numero / 20

        ]);


        // 0 = PAR
        // 1 = IMPAR

        salidas.push([

            numero % 2

        ]);

    }


    // Tensores

    const xs =
        tf.tensor2d(entradas);


    const ys =
        tf.tensor2d(salidas);


    // Crear modelo

    modelo =
        tf.sequential();


    modelo.add(

        tf.layers.dense({

            inputShape: [1],

            units: 4,

            activation: "relu"

        })

    );


    modelo.add(

        tf.layers.dense({

            units: 1,

            activation: "sigmoid"

        })

    );


    // Configuración

    modelo.compile({

        optimizer: "adam",

        loss: "binaryCrossentropy"

    });


    // Entrenamiento

    await modelo.fit(

        xs,

        ys,

        {

            epochs: 10,

            shuffle: true,

            verbose: 0

        }

    );


    // Liberar memoria

    xs.dispose();

    ys.dispose();


    estado.innerText =
        "✅ Red Neuronal lista";

}


// =================================================
// ANALIZAR
// =================================================

async function analizarNumero() {


    if (modelo === null) {

        alert(
            "⏳ Espera a que la RNA termine de entrenarse."
        );

        return;

    }


    const campo =
        document.getElementById("numero");


    const numero =
        Number(campo.value);


    if (

        campo.value === "" ||

        !Number.isInteger(numero)

    ) {

        document.getElementById(
            "resultado"
        ).innerHTML = `

            <div class="info">

                ⚠️ Introduce un número entero.

            </div>

        `;

        return;

    }


    // ---------------------------------------------
    // PREDICCIÓN RNA
    // ---------------------------------------------

    const entrada =
        tf.tensor2d([

            [numero / 20]

        ]);


    const prediccion =
        modelo.predict(entrada);


    const valor =
        (await prediccion.data())[0];


    entrada.dispose();

    prediccion.dispose();


    // ---------------------------------------------
    // PAR / IMPAR
    // ---------------------------------------------

    const paridad =

        numero % 2 === 0

            ? "PAR"

            : "IMPAR";


    // ---------------------------------------------
    // CONFIANZA
    // ---------------------------------------------

    let confianza;


    if (paridad === "IMPAR") {

        confianza =
            valor * 100;

    } else {

        confianza =
            (1 - valor) * 100;

    }


    // ---------------------------------------------
    // PRIMO
    // ---------------------------------------------

    const primo =
        esPrimo(numero);


    const textoPrimo =

        primo

            ? "PRIMO 🟢"

            : "NO PRIMO 🔴";


    // ---------------------------------------------
    // MOSTRAR
    // ---------------------------------------------

    document.getElementById(
        "resultado"
    ).innerHTML = `


        <div class="numero">

            ${numero}

        </div>


        <div class="grid">


            <div class="resultado-card">

                <h3>

                    🧠 RNA

                </h3>


                <div class="valor">

                    ${paridad}

                </div>


                <div class="confianza">

                    Confianza aproximada

                    <br>

                    <strong>

                        ${confianza.toFixed(2)}%

                    </strong>

                </div>

            </div>



            <div class="resultado-card">

                <h3>

                    🔬 Primo

                </h3>


                <div class="valor">

                    ${textoPrimo}

                </div>


                <div class="confianza">

                    Análisis matemático

                </div>

            </div>


        </div>


        <hr class="separador">


        <div class="info">

            🧠 <strong>¿Cómo funciona?</strong>

            <br><br>

            La Red Neuronal Artificial recibe
            el número y realiza una predicción
            de su paridad.

            <br><br>

            Además, el programa comprueba
            matemáticamente si el número es primo.

        </div>

    `;

}


// =================================================
// BOTÓN ANALIZAR
// =================================================

document

    .getElementById("analizar")

    .addEventListener(

        "click",

        analizarNumero

    );


// =================================================
// BOTÓN LIMPIAR
// =================================================

document

    .getElementById("limpiar")

    .addEventListener(

        "click",

        function() {


            document

                .getElementById("numero")

                .value = "";


            document

                .getElementById("resultado")

                .innerHTML = `

                    <div class="info">

                        🧠 Introduce un número
                        y pulsa
                        <strong>ANALIZAR</strong>.

                    </div>

                `;

        }

    );


// =================================================
// INICIAR RNA
// =================================================

entrenarRNA();

</script>


</body>

</html>
