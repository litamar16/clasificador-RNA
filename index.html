<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RNA - Clasificador de Números</title>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>

</head>


<body>

    <h1>🧠 Clasificador de Números con RNA</h1>

    <p id="estado">
        ⏳ Preparando Red Neuronal...
    </p>


    <hr>


    <h2>Introduce un número</h2>

    <input
        id="numero"
        type="number"
        placeholder="Ejemplo: 17"
    >


    <br><br>


    <button id="btnAnalizar">
        🔍 ANALIZAR
    </button>


    <button id="btnLimpiar">
        🧹 LIMPIAR
    </button>


    <hr>


    <div id="resultado">

        Aquí aparecerán los resultados.

    </div>


    <!-- Nuestro JavaScript -->

    <script src="./script.js"></script>

</body>

</html>
